<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dewy</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-top: 20px; }
        h1 { font-size: 20px; color: #2c3e50; margin-top: 0; text-align: center; margin-bottom: 20px; user-select: none; }
        
        .nav { display: flex; background: #f1f5f9; border-radius: 12px; padding: 4px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 10px 0; text-align: center; font-size: 13px; font-weight: bold; color: #64748b; cursor: pointer; border-radius: 8px; transition: all 0.2s; user-select: none; }
        .nav-btn.active { background: #ffffff; color: #0f172a; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: #f8fafc; padding: 15px; border-radius: 12px; text-align: center; }
        .card-title { font-size: 11px; color: #64748b; margin-bottom: 5px; }
        .card-value { font-size: 24px; font-weight: bold; color: #0f172a; }
        .full-width { grid-column: span 2; }
        
        .sub-nav { display: flex; gap: 8px; justify-content: center; margin-top: 10px; margin-bottom: 5px; flex-wrap: wrap; }
        .sub-nav-btn { font-size: 11px; color: #94a3b8; padding: 4px 12px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e8f0; cursor: pointer; transition: all 0.2s; user-select: none; }
        .sub-nav-btn:hover { border-color: #cbd5e1; color: #64748b; }
        .sub-nav-btn.active { background: #10b981; color: white; border-color: #10b981; font-weight: bold; }

        .status-bar { margin-top: 20px; font-size: 12px; color: #94a3b8; text-align: center; }
        button.action-btn { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button.action-btn:hover { background: #059669; }
        
        .camera-container { position: relative; width: 100%; background: #f1f5f9; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        #cam-img { width: 100%; height: auto; border-radius: 8px; display: block; cursor: zoom-in; transition: opacity 0.2s; }
        #cam-img:hover { opacity: 0.9; }
        #cam-timestamp { font-size: 11px; color: #94a3b8; margin-top: 8px; font-weight: normal; min-height: 14px;}
        .hidden { display: none !important; }

        .chart-container { position: relative; width: 100%; height: 280px; margin-top: 10px; }
        .loading-text { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 12px; font-weight: 500; }
        
        #watering-log-wrapper { height: 280px; overflow-y: auto; padding: 5px; margin-top: 15px; position: relative; }
        .log-list { display: flex; flex-direction: column; gap: 10px; }
        .log-item { background: #f8fafc; padding: 12px 15px; border-radius: 8px; border-left: 4px solid #3b82f6; display: flex; flex-direction: column; gap: 4px; text-align: left; }
        .log-time { font-weight: bold; color: #334155; font-size: 13px; }
        .log-detail { color: #64748b; font-size: 11px; }

        #hd-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); z-index: 1000; align-items: center; justify-content: center;
            flex-direction: column; backdrop-filter: blur(5px);
        }
        #hd-img {
            max-width: 95%; max-height: 80vh; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); object-fit: contain; transition: opacity 0.3s;
        }
        #hd-status { color: #f8fafc; margin-bottom: 15px; font-size: 13px; letter-spacing: 0.5px;}
        #hd-timestamp { color: #94a3b8; font-size: 11px; margin-top: 12px; font-weight: normal; transition: opacity 0.3s;}
        
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #10b981;
            border-radius: 50%;
            width: 24px; height: 24px;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .close-btn { margin-top: 20px; background: rgba(255,255,255,0.15); color: white; padding: 10px 24px; border-radius: 20px; cursor: pointer; border: 1px solid rgba(255,255,255,0.3); font-size: 13px; transition: background 0.2s; }
        .close-btn:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>
    <div id="hd-modal">
        <div class="loader" id="hd-loader"></div>
        <div id="hd-status">capturing hd image... (est. 10s+)</div>
        <img id="hd-img" src="" alt="hd view">
        <div id="hd-timestamp" class="hidden"></div>
        <div class="close-btn" onclick="closeHD()">close</div>
    </div>

    <div class="container">
        <h1>🌱 dewy</h1>
        
        <div class="nav">
            <div class="nav-btn active" onclick="switchTab('plant')" id="tab-plant">plant</div>
            <div class="nav-btn" onclick="switchTab('system')" id="tab-system">system</div>
            <div class="nav-btn" onclick="switchTab('history')" id="tab-history">history</div>
        </div>
        
        <div class="grid" id="view-plant">
            <div class="card"><div class="card-title">temperature</div><div class="card-value" id="temp">-- ℃</div></div>
            <div class="card"><div class="card-title">humidity</div><div class="card-value" id="env-humidity">-- %</div></div>
            <div class="card full-width"><div class="card-title">soil humidity</div><div class="card-value" style="color: #059669;" id="soil-humidity">-- %</div></div>
            <div class="card full-width hidden" id="camera-block">
                <div class="card-title">camera</div>
                <div class="camera-container"><img id="cam-img" alt="camera view" onclick="fetchHDImage()" /></div>
                <div id="cam-timestamp"></div> 
            </div>
            <div class="card full-width hidden" id="water-block">
                <button class="action-btn" id="water-btn" style="background: #3b82f6; margin-top: 0; padding: 16px; font-size: 15px;" onclick="triggerWatering()">💧 Water Plant</button>
            </div>
        </div>

        <div class="grid hidden" id="view-system">
            <div class="card full-width"><div class="card-title">power status</div><div class="card-value" style="color: #0284c7;" id="power-status">-- V / -- mA</div></div>
            <div class="card"><div class="card-title">cpu temp</div><div class="card-value" style="color: #e11d48;" id="sys-temp">-- ℃</div></div>
            <div class="card"><div class="card-title">ram used</div><div class="card-value" id="sys-ram">-- %</div></div>
            <div class="card full-width"><div class="card-title">disk storage used</div><div class="card-value" id="sys-disk">-- %</div></div>
        </div>

        <div class="grid hidden" id="view-history">
            <div class="card full-width" style="padding-bottom: 20px;">
                <div class="card-title">environmental trends</div>
                
                <div class="sub-nav">
                    <div class="sub-nav-btn active" id="hist-24h" onclick="switchHistType('24h')">past 24h</div>
                    <div class="sub-nav-btn" id="hist-daily" onclick="switchHistType('daily')">daily avg</div>
                    <div class="sub-nav-btn" id="hist-watering" onclick="switchHistType('watering')">watering log</div>
                </div>

                <div class="chart-container" id="chart-container-wrapper">
                    <div id="chart-loading" class="loading-text hidden">loading...</div>
                    <canvas id="historyChart"></canvas>
                </div>
                
                <div id="watering-log-wrapper" class="hidden"></div>
            </div>
        </div>
        
        <button class="action-btn" onclick="fetchAllData(true)">refresh</button>
        <div class="status-bar" id="update-time">not synced</div>
    </div>

    <script>
        const STORAGE_KEY = 'robin_viewer_key';
        
        let sessionHDSrc = null;
        let sessionHDTime = null;
        let sessionHDEpoch = 0;
        let myChart = null; 
        let currentTab = 'plant';
        let currentHistType = '24h'; 
        
        // 分离式内存缓存体系，分别记录 24h, daily, watering 的数据
        const historyCache = {
            '24h': null,
            'daily': null,
            'watering': null
        };

        function switchTab(tabName) {
            currentTab = tabName;
            const hasKey = !!localStorage.getItem(STORAGE_KEY);
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');

            document.getElementById('view-plant').classList.add('hidden');
            document.getElementById('view-system').classList.add('hidden');
            document.getElementById('view-history').classList.add('hidden');

            document.getElementById('view-' + tabName).classList.remove('hidden');

            const cameraBlock = document.getElementById('camera-block');
            if (tabName === 'plant' && hasKey) {
                cameraBlock.classList.remove('hidden');
            } else {
                cameraBlock.classList.add('hidden');
            }

            const hasWaterKey = !!localStorage.getItem('robin_water_key');
            const waterBlock = document.getElementById('water-block');
            if (tabName === 'plant' && hasWaterKey) {
                if (waterBlock) waterBlock.classList.remove('hidden');
            } else {
                if (waterBlock) waterBlock.classList.add('hidden');
            }

            if (tabName === 'history') {
                fetchHistoryData();
            }
        }

        function switchHistType(type) {
            currentHistType = type;
            document.querySelectorAll('.sub-nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('hist-' + type).classList.add('active');
            
            if (type === 'watering') {
                document.getElementById('chart-container-wrapper').classList.add('hidden');
                document.getElementById('watering-log-wrapper').classList.remove('hidden');
            } else {
                document.getElementById('chart-container-wrapper').classList.remove('hidden');
                document.getElementById('watering-log-wrapper').classList.add('hidden');
            }
            
            fetchHistoryData();
        }

        function checkMagicLink() {
            const urlParams = new URLSearchParams(window.location.search);
            let updated = false;
            if (urlParams.get('key')) {
                localStorage.setItem(STORAGE_KEY, urlParams.get('key'));
                updated = true;
            }
            if (urlParams.get('water_key')) {
                localStorage.setItem('robin_water_key', urlParams.get('water_key'));
                updated = true;
            }
            if (updated) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        async function triggerWatering() {
            const waterKey = localStorage.getItem('robin_water_key');
            if (!waterKey) return;
            
            const btn = document.getElementById('water-btn');
            const originalText = btn.innerText;
            btn.innerText = '💧 Watering...';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                const res = await fetch('/api/water', {
                    method: 'POST',
                    headers: { 'x-water-key': waterKey }
                });
                
                if (res.ok) {
                    btn.innerText = '✅ Success';
                    btn.style.background = '#10b981';
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = '#3b82f6';
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        fetchAllData(true);
                    }, 2000);
                } else {
                    btn.innerText = '❌ Failed';
                    btn.style.background = '#ef4444';
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = '#3b82f6';
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        if (res.status === 403) {
                            localStorage.removeItem('robin_water_key');
                            document.getElementById('water-block').classList.add('hidden');
                        }
                    }, 2000);
                }
            } catch (e) {
                btn.innerText = '❌ Error';
                btn.style.background = '#ef4444';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = '#3b82f6';
                    btn.disabled = false;
                    btn.style.opacity = '1';
                }, 2000);
            }
        }

        async function fetchSensorData() {
            const savedKey = localStorage.getItem(STORAGE_KEY) || '';
            try {
                const res = await fetch('/api/monitor', {
                    headers: { 'X-Viewer-Key': savedKey, 'X-Requested-By': 'Robin-Web' }
                });
                const data = await res.json();
                if (data.error) return;

                document.getElementById('temp').innerText = data.environment.temperature + ' ℃';
                document.getElementById('env-humidity').innerText = data.environment.humidity + ' %';
                document.getElementById('soil-humidity').innerText = data.environment.soil_moisture + ' %';
                
                const cVal = data.power.current;
                document.getElementById('power-status').innerText = data.power.voltage + ' V / ' + (cVal > 0 ? '+' + cVal : cVal) + ' mA';
                
                if (data.system_health) {
                    document.getElementById('sys-temp').innerText = data.system_health.cpu_temperature + ' ℃';
                    document.getElementById('sys-ram').innerText = data.system_health.ram_usage_percent + ' %';
                    document.getElementById('sys-disk').innerText = data.system_health.disk_usage_percent + ' %';
                }
                
                const time = new Date(data.timestamp * 1000);
                document.getElementById('update-time').innerText = 'last synced at ' + time.toLocaleTimeString().toLowerCase();
            } catch (e) { console.error(e); }
        }

        // 核心逻辑拆分：专门负责将数据画到屏幕上的函数
        function renderHistoryUI(data, type) {
            if (type === 'watering') {
                const wrapper = document.getElementById('watering-log-wrapper');
                if (!data || data.length === 0) {
                    wrapper.innerHTML = '<div class="loading-text">no watering records yet.</div>';
                    return;
                }
                let html = '<div class="log-list">';
                data.forEach(item => {
                    html += '<div class="log-item">' +
                            '<div class="log-time">💧 ' + item.time + '</div>' +
                            '<div class="log-detail">pumped ' + item.duration + 's (soil was ' + item.soil + '%)</div>' +
                            '</div>';
                });
                html += '</div>';
                wrapper.innerHTML = html;
                return;
            }

            // 图表渲染逻辑
            if (!data || data.length === 0) return;
            document.getElementById('chart-loading').classList.add('hidden');
            
            // 使用深拷贝保护缓存数据不被污染
            let chartData = JSON.parse(JSON.stringify(data)); 

            if (type === '24h') {
                for (let i = 1; i < chartData.length; i++) {
                    if (chartData[i].soil !== null && chartData[i-1].soil !== null && 
                        chartData[i].soil < 10 && (chartData[i-1].soil - chartData[i].soil > 5)) {
                        let recoveryIndex = -1;
                        for (let j = i + 1; j <= Math.min(i + 3, chartData.length - 1); j++) {
                            if (chartData[j].soil !== null && chartData[j-1].soil !== null && (chartData[j].soil - chartData[j-1].soil > 10)) {
                                recoveryIndex = j;
                                break;
                            }
                        }
                        if (recoveryIndex !== -1) {
                            for (let k = i; k < recoveryIndex; k++) chartData[k].soil = null;
                            i = recoveryIndex - 1;
                        }
                    }
                }
            }

            const labels = chartData.map(d => d.time);
            const temps = chartData.map(d => d.temp);
            const hums = chartData.map(d => d.hum);
            const soils = chartData.map(d => d.soil);

            const ctx = document.getElementById('historyChart').getContext('2d');
            if (myChart) myChart.destroy(); 
            
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        // ✨ 将 spanGaps 改为 true，强制连接所有断点
                        { label: 'temp (℃)', data: temps, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', tension: 0.4, pointRadius: 0, pointHitRadius: 10, pointHoverRadius: 4, yAxisID: 'y', spanGaps: true },
                        { label: 'hum (%)', data: hums, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', tension: 0.4, pointRadius: 0, pointHitRadius: 10, pointHoverRadius: 4, yAxisID: 'y1', spanGaps: true },
                        { label: 'soil (%)', data: soils, borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', tension: 0.4, pointRadius: 0, pointHitRadius: 10, pointHoverRadius: 4, yAxisID: 'y1', spanGaps: true }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { labels: { boxWidth: 12, font: { size: 10, family: '-apple-system' } } } },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 6, font: { size: 10 } } },
                        y: { type: 'linear', display: true, position: 'left', ticks: { font: { size: 10 } } },
                        y1: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        async function fetchHistoryData() {
            const savedKey = localStorage.getItem(STORAGE_KEY) || '';
            const reqType = currentHistType; // 记住发起请求时的类型

            // ✨ 1. 如果内存里有缓存，立刻用缓存画图（0毫秒延迟），消除白屏
            if (historyCache[reqType]) {
                renderHistoryUI(historyCache[reqType], reqType);
            } else {
                // 如果没有缓存，为了避免“幽灵数据”，立刻销毁旧图表并显示 loading
                if (reqType === 'watering') {
                    document.getElementById('watering-log-wrapper').innerHTML = '<div class="loading-text">loading...</div>';
                } else {
                    if (myChart) { myChart.destroy(); myChart = null; }
                    document.getElementById('chart-loading').classList.remove('hidden');
                }
            }

            // ✨ 2. 后台偷偷向树莓派要最新的数据
            try {
                const res = await fetch('/api/history?hist_type=' + reqType, {
                    headers: { 'X-Viewer-Key': savedKey, 'X-Requested-By': 'Robin-Web' }
                });
                const data = await res.json();
                
                // 存入内存缓存
                historyCache[reqType] = data;

                // ✨ 3. 如果数据回来时，用户还在看这个页面，就静默更新它
                if (currentHistType === reqType) {
                    renderHistoryUI(data, reqType);
                }
            } catch (e) { 
                console.error('history error', e); 
            }
        }

        async function fetchImage(forceLive = false) {
            const savedKey = localStorage.getItem(STORAGE_KEY);
            const cameraBlock = document.getElementById('camera-block');
            
            if (!savedKey) { cameraBlock.classList.add('hidden'); return; }

            const img = document.getElementById('cam-img');
            const camTs = document.getElementById('cam-timestamp');

            camTs.innerText = 'syncing...'; 
            camTs.style.color = '#94a3b8'; 
            
            try {
                const endpoint = forceLive ? '/api/image?live=true&t=' : '/api/image?t=';
                const res = await fetch(endpoint + new Date().getTime(), {
                    method: 'GET', headers: { 'X-Viewer-Key': savedKey }
                });
                
                if (!res.ok) { 
                    camTs.innerText = '⚠️ camera hardware offline or error';
                    camTs.style.color = '#ef4444';
                    if (currentTab === 'plant') cameraBlock.classList.remove('hidden');
                    return; 
                }

                const timestamp = res.headers.get('X-Image-Timestamp');
                const blob = await res.blob();
                
                img.onload = () => {
                    if (timestamp) {
                        const imgDate = new Date(parseInt(timestamp) * 1000);
                        const isStale = (Date.now() - imgDate.getTime()) > 60000; 
                        camTs.innerText = (isStale ? '⏳ ' : '📸 ') + imgDate.toLocaleTimeString().toLowerCase();
                        camTs.style.color = '#94a3b8'; 
                    }
                };
                img.src = URL.createObjectURL(blob);
                
                if (currentTab === 'plant') cameraBlock.classList.remove('hidden');
            } catch (e) { 
                camTs.innerText = '⚠️ network disconnected';
                camTs.style.color = '#ef4444'; 
                if (currentTab === 'plant') cameraBlock.classList.remove('hidden');
            }
        }

        async function fetchHDImage() {
            const savedKey = localStorage.getItem(STORAGE_KEY);
            if (!savedKey) return;

            const modal = document.getElementById('hd-modal');
            const hdImg = document.getElementById('hd-img');
            const statusText = document.getElementById('hd-status');
            const loader = document.getElementById('hd-loader');
            const hdTs = document.getElementById('hd-timestamp');

            hdImg.onload = null;

            const now = Date.now();
            if (sessionHDSrc && sessionHDEpoch > 0 && (now - sessionHDEpoch < 60000)) {
                statusText.style.display = 'none';
                loader.style.display = 'none';
                hdImg.src = sessionHDSrc;
                hdImg.style.display = 'block';
                hdImg.style.opacity = '1';
                hdImg.style.filter = 'none';
                hdTs.innerText = '📸 ' + sessionHDTime;
                hdTs.classList.remove('hidden');
                hdTs.style.opacity = '1';
                modal.style.display = 'flex';
                return;
            }

            statusText.style.display = 'block';
            statusText.innerText = 'capturing hd image... (est. 10s+)';
            loader.style.display = 'block';
            modal.style.display = 'flex';

            if (sessionHDSrc) {
                hdImg.src = sessionHDSrc;
                hdImg.style.display = 'block';
                hdImg.style.opacity = '1';
                hdImg.style.filter = 'none';
                if (sessionHDTime) {
                    hdTs.innerText = '📸 ' + sessionHDTime;
                    hdTs.classList.remove('hidden');
                    hdTs.style.opacity = '1';
                }
            } else {
                hdImg.style.display = 'none';
                hdTs.classList.add('hidden');
            }

            try {
                const res = await fetch('/api/image?live=true&hq=true&t=' + new Date().getTime(), {
                    method: 'GET', headers: { 'X-Viewer-Key': savedKey }
                });
                
                if (!res.ok) throw new Error('capture failed');

                const timestamp = res.headers.get('X-Image-Timestamp');
                const liveBlob = await res.blob();
                
                hdImg.onload = () => {
                    statusText.style.display = 'none';
                    loader.style.display = 'none';
                    hdImg.style.display = 'block';
                    sessionHDEpoch = Date.now();
                    if (timestamp) {
                        const imgDate = new Date(parseInt(timestamp) * 1000);
                        sessionHDTime = imgDate.toLocaleTimeString().toLowerCase();
                        hdTs.innerText = '📸 ' + sessionHDTime;
                        hdTs.classList.remove('hidden');
                    }
                };

                if (sessionHDSrc) URL.revokeObjectURL(sessionHDSrc);
                sessionHDSrc = URL.createObjectURL(liveBlob);
                hdImg.src = sessionHDSrc;

            } catch (e) {
                loader.style.display = 'none';
                statusText.style.display = 'block';
                statusText.innerText = '❌ failed to capture hd image.';
                statusText.style.color = '#ef4444';
            }
        }

        function closeHD() { document.getElementById('hd-modal').style.display = 'none'; }

        async function fetchAllData(forceLive = false) {
            const btn = document.querySelector('.action-btn');
            btn.innerText = 'syncing...';
            
            await fetchSensorData();
            if (currentTab === 'plant') await fetchImage(forceLive);
            if (currentTab === 'history') await fetchHistoryData();
            
            btn.innerText = 'refresh';
        }

        window.onload = () => {
            checkMagicLink();
            switchTab('plant'); 
            fetchAllData(true); 
        };
    </script>
</body>
</html>`
