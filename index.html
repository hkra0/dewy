<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>dewy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- 字体不阻塞首屏：URL 里已有 display=swap，本来就会 FOUT，
         没理由再为它推迟渲染。不支持 onload 的浏览器走 <noscript> 兜底。 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"
        media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet">
    </noscript>
    <link rel="stylesheet" href="/style.css">

    <!-- 不要在这里引 Chart.js / gifshot：约 240KB，且只有历史页与照片页用得上。
         由 js/cdn.js 在进入对应视图时按需加载。 -->

    <!-- 模块图是串行发现的：浏览器要先下 app.js 才知道有 js/*.js。
         预声明一遍，把瀑布压平。新增模块时记得同步这里和 worker.js 的 JS_MODULES。 -->
    <link rel="modulepreload" href="/js/i18n.js">
    <link rel="modulepreload" href="/js/state.js">
    <link rel="modulepreload" href="/js/api.js">
    <link rel="modulepreload" href="/js/ui.js">
    <link rel="modulepreload" href="/js/cdn.js">
    <link rel="modulepreload" href="/js/navigation.js">
    <link rel="modulepreload" href="/js/dashboard.js">
    <link rel="modulepreload" href="/js/camera.js">
    <link rel="modulepreload" href="/js/history.js">
    <link rel="modulepreload" href="/js/timeline.js">
    <link rel="modulepreload" href="/js/settings.js">
    <link rel="modulepreload" href="/js/refresh.js">
    <link rel="modulepreload" href="/js/metrics.js">
</head>

<body>
    <!-- Esc 与点击背景关闭由 initModalDismiss() 绑定（js/camera.js） -->
    <div id="hd-modal" role="dialog" aria-modal="true" aria-label="photo viewer">
        <div class="loader" id="hd-loader"></div>
        <div id="hd-status" data-i18n="capturing_hd">capturing hd image...</div>
        <img id="hd-img" src="" alt="hd view">
        <div id="hd-timestamp" class="hidden"></div>
        <button type="button" class="close-btn" onclick="closeHD()" data-i18n="close">close</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>🌱 dewy</h1>
            <div id="device-select-wrapper" class="device-select-wrapper hidden">
                <select id="device-select" class="device-select" aria-label="device"
                    onchange="switchDevice(this.value, true)">
                    <option value="main">Loading...</option>
                </select>
                <span class="device-select-caret" aria-hidden="true">▼</span>
            </div>
        </div>

        <!-- 这些必须是真的 <button>：换成 div 就没有 Tab 焦点、没有 Enter/Space
             激活、屏幕阅读器也读不出"按钮"。样式在 style.css 里做了 UA 复位。 -->
        <nav class="nav" aria-label="views">
            <button type="button" class="nav-btn active" onclick="switchTab('environment')" id="tab-environment"
                data-i18n="env">environment</button>
            <button type="button" class="nav-btn" onclick="switchTab('system')" id="tab-system"
                data-i18n="sys">system</button>
            <button type="button" class="nav-btn" onclick="switchTab('history')" id="tab-history"
                data-i18n="hist">history</button>
            <button type="button" class="nav-btn hidden" onclick="switchTab('settings')" id="tab-settings"
                data-i18n="settings">settings</button>
        </nav>

        <!-- Dynamic Environment View -->
        <div id="view-environment" class="view-section">
            <div class="grid" id="dynamic-cards">
                <!-- Cards will be injected here -->
            </div>

            <div class="card full-width hidden" id="camera-block" style="margin-top: 15px;">
                <div class="card-title" data-i18n="camera">camera</div>
                <div class="camera-container"><img id="cam-img" alt="camera view, activate for a high-res capture"
                        role="button" tabindex="0" onclick="fetchHDImage()" /></div>
                <div id="cam-timestamp"></div>
            </div>

            <details class="card full-width water-block hidden" id="water-block">
                <summary data-i18n="manual_water">manual watering</summary>
                <div class="water-row">
                    <div class="water-field">
                        <label for="water-duration" class="water-label" data-i18n="duration_s">Duration (s):</label>
                        <input type="number" id="water-duration" class="form-input form-input--sm" min="0.1" max="1.0"
                            step="0.1" value="0.5">
                    </div>
                    <button class="action-btn water-btn" id="water-btn" onclick="triggerWatering()"
                        data-i18n="water_btn">Water</button>
                </div>
            </details>
        </div>

        <!-- System View -->
        <div class="grid hidden view-section" id="view-system">
            <div class="card full-width">
                <div class="card-title" data-i18n="power_status">power status</div>
                <div class="card-value" style="color: var(--metric-power);" id="power-status">-- V / -- mA</div>
            </div>
            <div class="card">
                <div class="card-title" data-i18n="cpu_temp">cpu temp</div>
                <div class="card-value" style="color: var(--metric-cpu);" id="sys-temp">-- ℃</div>
            </div>
            <div class="card">
                <div class="card-title" data-i18n="ram_used">ram used</div>
                <div class="card-value" id="sys-ram">-- %</div>
            </div>
            <div class="card full-width">
                <div class="card-title" data-i18n="disk_used">disk storage used</div>
                <div class="card-value" id="sys-disk">-- %</div>
            </div>
        </div>

        <!-- History View -->
        <div class="grid hidden view-section" id="view-history">
            <div class="card full-width" style="padding-bottom: 20px;">
                <div class="card-title" data-i18n="env_trends">environmental trends</div>
                <div class="sub-nav" id="history-type-nav">
                    <button type="button" class="sub-nav-btn active" id="hist-24h" onclick="switchHistType('24h')"
                        data-i18n="past_24h">24h</button>
                    <button type="button" class="sub-nav-btn" id="hist-daily" onclick="switchHistType('daily')"
                        data-i18n="daily_avg">day</button>
                    <button type="button" class="sub-nav-btn" id="hist-watering" onclick="switchHistType('watering')"
                        data-i18n="watering_log">water</button>
                    <button type="button" class="sub-nav-btn hidden" id="hist-photos" onclick="switchHistType('photos')"
                        data-i18n="photo_log">photo</button>
                </div>

                <div class="chart-container" id="chart-container-wrapper">
                    <div id="chart-loading" class="loading-text hidden" data-i18n="chart_loading">loading...</div>
                    <canvas id="historyChart"></canvas>
                </div>
                <div id="watering-log-wrapper" class="hidden"></div>
                <div id="photo-timeline-wrapper" class="hidden">
                    <div class="photo-viewer" id="photo-viewer" role="button" tabindex="0" onclick="viewFullPhoto()">
                        <div id="timeline-loading" class="photo-empty-msg hidden" style="z-index: 5;"
                            data-i18n="chart_loading">loading...</div>
                        <img id="timeline-img" alt="" />
                        <div id="timeline-date" class="photo-date-label"></div>
                        <div id="timeline-empty" class="photo-empty-msg hidden" data-i18n="no_photos">no photos yet
                        </div>
                    </div>
                    <div class="timeline-controls" id="timeline-controls">
                        <button class="tl-btn" id="tl-play-btn" onclick="toggleTimelinePlay()">&#9654;</button>
                        <input type="range" class="tl-slider" id="tl-slider" min="0" max="0" value="0"
                            oninput="seekTimeline(this.value)" />
                        <span class="tl-counter" id="tl-counter">0 / 0</span>
                        <select class="tl-speed" id="tl-speed" onchange="setTimelineSpeed(this.value)">
                            <option value="1000">1x</option>
                            <option value="500" selected>2x</option>
                            <option value="250">4x</option>
                        </select>
                        <button class="tl-action-btn" id="tl-export-btn" onclick="exportTimelineGIF()"
                            data-i18n="export_gif" title="Export GIF">GIF</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings View -->
        <div class="grid hidden view-section" id="view-settings">
            <div class="card full-width form-card">
                <div class="form-card-head">
                    <span data-i18n="auto_water">Auto Watering</span>
                    <label class="switch"><input type="checkbox" id="cfg-water-enabled" aria-label="auto watering"><span
                            class="slider"></span></label>
                </div>
                <div class="form-body">
                    <div class="form-row">
                        <label for="cfg-water-threshold" data-i18n="threshold">Threshold (%)</label>
                        <input type="number" id="cfg-water-threshold" class="form-input form-input--sm">
                    </div>
                    <div class="form-row">
                        <label for="cfg-water-duration" data-i18n="duration">Duration (s)</label>
                        <input type="number" id="cfg-water-duration" class="form-input form-input--sm" step="0.1">
                    </div>
                </div>
            </div>
            <div class="card full-width form-card">
                <div class="form-card-head">
                    <span data-i18n="fill_light">Fill Light</span>
                    <label class="switch"><input type="checkbox" id="cfg-light-enabled" aria-label="fill light"><span
                            class="slider"></span></label>
                </div>
                <div class="form-body">
                    <div class="form-row">
                        <label for="cfg-light-mode" data-i18n="mode">Mode</label>
                        <select id="cfg-light-mode" class="form-select" onchange="toggleLightMode()">
                            <option value="fixed" data-i18n="fixed_time">Fixed Time</option>
                            <option value="sun" data-i18n="sunrise_sunset">Sunrise &amp; Sunset</option>
                        </select>
                    </div>

                    <div id="cfg-light-fixed-group" class="form-group">
                        <div class="form-row">
                            <label for="cfg-light-on" data-i18n="turn_on">Turn On</label>
                            <input type="time" id="cfg-light-on" class="form-input">
                        </div>
                        <div class="form-row">
                            <label for="cfg-light-off" data-i18n="turn_off">Turn Off</label>
                            <input type="time" id="cfg-light-off" class="form-input">
                        </div>
                    </div>

                    <div id="cfg-light-sun-group" class="form-group hidden">
                        <div class="form-cols">
                            <div class="form-col">
                                <label for="cfg-light-lat" class="form-label-block" data-i18n="lat">Latitude</label>
                                <input type="text" id="cfg-light-lat" class="form-input form-input--full"
                                    placeholder="auto">
                            </div>
                            <div class="form-col">
                                <label for="cfg-light-lng" class="form-label-block" data-i18n="lng">Longitude</label>
                                <input type="text" id="cfg-light-lng" class="form-input form-input--full"
                                    placeholder="auto">
                            </div>
                        </div>
                        <div class="form-row">
                            <label for="cfg-light-on-offset" data-i18n="on_offset">On Offset (min)</label>
                            <input type="number" id="cfg-light-on-offset" class="form-input form-input--sm">
                        </div>
                        <div class="form-row">
                            <label for="cfg-light-off-offset" data-i18n="off_offset">Off Offset (min)</label>
                            <input type="number" id="cfg-light-off-offset" class="form-input form-input--sm">
                        </div>
                        <div id="cfg-light-effective-times" class="form-hint" data-i18n="currently_scheduled">Currently
                            scheduled: --:-- to --:--</div>
                    </div>
                </div>
            </div>

            <!-- 拍照。补光是所有拍摄路径（实时预览 / 高清抓拍 / 每日照片）共用的
                 全局设置，每日照片只是其中一种拍摄，所以同属这一张卡。 -->
            <div class="card full-width form-card" id="cfg-photo-card">
                <div class="form-card-head">
                    <span data-i18n="photo_capture">Photo Capture</span>
                </div>
                <div class="form-body">
                    <div class="form-row" id="cfg-photo-fill-light-row">
                        <label for="cfg-photo-fill-light" data-i18n="photo_fill_light">Fill Light While
                            Capturing</label>
                        <label class="switch"><input type="checkbox" id="cfg-photo-fill-light"
                                aria-label="fill light while capturing"><span class="slider"></span></label>
                    </div>
                    <div class="form-row">
                        <label for="cfg-photo-enabled" data-i18n="daily_photo">Daily Photo</label>
                        <label class="switch"><input type="checkbox" id="cfg-photo-enabled"
                                aria-label="daily photo"><span class="slider"></span></label>
                    </div>
                    <div class="form-group">
                        <div class="form-row">
                            <label for="cfg-photo-hour" data-i18n="photo_hour">Capture Hour</label>
                            <input type="number" id="cfg-photo-hour" class="form-input form-input--sm" min="0" max="23"
                                step="1">
                        </div>
                        <button class="form-action-btn" id="retake-photo-btn" onclick="retakeTodayPhoto()"
                            data-i18n="retake_photo">Retake Today's Photo</button>
                    </div>
                </div>
            </div>

            <div class="card full-width form-card--flush">
                <button class="action-btn" id="save-cfg-btn" style="margin-top: 0;" onclick="saveConfig()"
                    data-i18n="save_cfg">Save Configuration</button>
            </div>
        </div>

        <button class="action-btn" id="refresh-btn" onclick="fetchAllData(true)" data-i18n="refresh">refresh</button>
        <div class="status-bar" id="update-time" data-i18n="not_synced">not synced</div>
    </div>


    <!-- role=status + aria-live: 没有它，"浇水指令已发送"这类唯一的操作反馈
         对屏幕阅读器用户完全不存在 -->
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
</body>

</html>
