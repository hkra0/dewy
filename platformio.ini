[platformio]
# 将源码目录重定向到固件目录
src_dir = firmware/plant_node/src
test_dir = firmware/plant_node/tests

[env:esp32s3mini]
custom_node = aqua
platform = espressif32 @ 7.0.1
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

# 引入 Python 脚本，路径需要加上相对路径
extra_scripts = pre:firmware/plant_node/inject_config.py

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    adafruit/Adafruit AHTX0
    adafruit/Adafruit BMP280 Library
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    fastled/FastLED

[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson @ ^7.4.3
test_build_src = no
build_flags = -std=c++17 -Ifirmware/plant_node/src
