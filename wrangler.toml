name = 'dewy'
main = "worker.js"
compatibility_date = "2024-03-20"

# [vars]
# PI_BASE_URL = ""

# The following secrets should be set via `wrangler secret put <NAME>`
# PI_SECRET_TOKEN
# VIEWER_MAGIC_KEY
# WATER_MAGIC_KEY

[[rules]]
type = "Text"
# 注意 `**/js/*.js` 的前缀：写成 `js/*.js` 匹配不到任何文件，
# 于是 js/*.js 会被当成普通 ES 模块打包，报 "No matching export for import default"，
# 整个 Worker 构建失败。改这行前先跑 `npx wrangler deploy --dry-run`。
globs = ["**/*.html", "**/*.css", "**/app.js", "**/js/*.js"]
fallthrough = true

[observability.logs]
enabled = false
invocation_logs = true
